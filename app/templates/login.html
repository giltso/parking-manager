{# Typing a code from another phone, or from a coordinator's message. #}
{% extends "base.html" %}
{% block content %}
  <h1>{{ t("login.title") }}</h1>
  <p class="muted">{{ t("login.intro") }}</p>

  {% if error %}<p class="error">{{ t(error) }}</p>{% endif %}

  <form method="post" action="/login" class="stack">
    <label>{{ t("login.code") }}
      {# Codes are letters and digits, shown large; autocapitalize helps on a
         phone keyboard, and dir="ltr" keeps them readable in Hebrew. #}
      <input name="code" class="code-input" dir="ltr" autocapitalize="characters"
             autocomplete="one-time-code" required>
    </label>
    <button type="submit" class="primary">{{ t("login.submit") }}</button>
  </form>
{% endblock %}
